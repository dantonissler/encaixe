name: encaixe

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      POSTGRES_DB: encaixe
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encaixe"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.4
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      DO_NOT_TRACK: "1"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:21.0.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_dev}@postgres:5432/phoenix
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ENABLE_AUTH: "false"
      DO_NOT_TRACK: "1"
    ports:
      - "6006:6006"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6006/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcp-tarefas:
    profiles: ["tools"]
    build: ./mcp-adapters/exemplo-tarefas
    ports:
      - "8765:8765"

  open-webui:
    profiles: ["ui"]
    image: ghcr.io/open-webui/open-webui:v0.12.5
    ports:
      - "38080:8080"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8100/v1
      OPENAI_API_KEY: ${ENCAIXE_WEBUI_API_KEY:-dev-key}
      ENABLE_OLLAMA_API: "false"
      SCARF_NO_ANALYTICS: "true"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openwebui:/app/backend/data

volumes:
  pgdata:
  redisdata:
  ollama:
  openwebui:
