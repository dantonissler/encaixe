# Casos dourados (28) no formato do promptfoo; mais 2 casos de escrita (2 turnos) em
# evals/multiturn.py. As vars user_ref/groups viram os headers X-User-Ref/X-User-Groups.
# As strings fixas (NOT_FOUND, REFUSAL_INPUT) espelham src/encaixe/messages.py
# (tests/evals/test_tests_yaml.py garante que continuam iguais).
- description: Quantos dias de férias tenho direito depois de um ano de trabalho?
  vars:
    prompt: Quantos dias de férias tenho direito depois de um ano de trabalho?
    user_ref: eval-user
    groups: ''
  metadata:
    category: rag
    expected_docs:
    - politica-ferias
  assert:
  - type: icontains
    value: '30'
- description: Posso dividir minhas férias? Em quantos períodos?
  vars:
    prompt: Posso dividir minhas férias? Em quantos períodos?
    user_ref: eval-user
    groups: ''
  metadata:
    category: rag
    expected_docs:
    - politica-ferias
  assert:
  - type: icontains-any
    value:
    - 3 períodos
    - três períodos
    - até 3
    - até três
