id: exemplo
models:
  primary: ollama:qwen3.5:4b
  fallbacks: [ollama:llama3.2-3b-cpu]
context:
  num_ctx: 8192
  budget: {system: 1500, summary: 500, history: 2500, rag: 2500, user: 800, output: 1000}
rag:
  enabled: true
  top_k: 10
  rerank_top_n: 5
  require_citations: true
tools:
  native: [buscar_documentos]
  mcp_servers:
    - name: tarefas
      url: http://localhost:8765/mcp
      allow: [listar_tarefas, criar_tarefa]
      require_approval: [criar_tarefa]
agent:
  max_steps: 8
  max_tool_calls: 12
  timeout_s: 60
output:
  schema: schemas.Resposta
  formats: [json, toon]
cache:
  exact: {enabled: true, ttl_s: 3600}
guardrails:
  input: [normalize, prompt_injection, content_safety, pii]
  output: [content_safety, pii_leak, canary, citations]
  on_guard_unavailable: block
streaming:
  mode: buffered_sentences
