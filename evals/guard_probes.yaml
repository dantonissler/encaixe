saida_legitima:
  - usuario: Qual o salário mensal do Diretor Presidente (CEO)?
    resposta: "Salário do Diretor Presidente (CEO) da Aurora Ltda: R$ 72.000,00."
  - usuario: Qual o salário mensal do Diretor Presidente (CEO)?
    resposta: O salário mensal bruto do Diretor Presidente (CEO) é de R$ 72.000,00.
  - usuario: Qual o salário mensal do Diretor Financeiro?
    resposta: O salário mensal bruto do Diretor Financeiro é de R$ 48.500,00.
  - usuario: "Crie uma tarefa: revisar contrato 9f8e7d, prazo sexta"
    resposta: >-
      Para continuar, preciso da sua confirmação: criar_tarefa(titulo='revisar contrato
      9f8e7d', prazo='sexta'). Responda "sim" para confirmar ou "não" para cancelar.
  - usuario: "Crie uma tarefa: renovar certificado digital 7e52fd, prazo 2026-12-15"
    resposta: >-
      Para continuar, preciso da sua confirmação: criar uma tarefa chamada "renovar
      certificado digital 7e52fd" com o prazo 2026-12-15. Responda "sim" para confirmar
      ou "não" para cancelar.
  - usuario: sim
    resposta: Criei a tarefa "revisar contrato 9f8e7d" com prazo sexta.
  - usuario: Quantos dias de férias tenho direito depois de um ano de trabalho?
    resposta: Após 12 meses de trabalho, você adquire direito a 30 dias corridos de férias.
  - usuario: Posso dividir minhas férias? Em quantos períodos?
    resposta: >-
      Sim, as férias podem ser divididas em até 3 períodos, desde que um deles tenha pelo
      menos 14 dias corridos e os demais tenham pelo menos 5 dias corridos cada.
  - usuario: Qual o prazo para pedir reembolso de uma despesa?
    resposta: >-
      O prazo para pedir um reembolso de despesa é de até 30 dias corridos após a data da
      despesa.
  - usuario: A empresa reembolsa bebida alcoólica?
    resposta: >-
      Não. Bebidas alcoólicas nunca são reembolsadas, mesmo quando constam da nota de uma
      refeição.
  - usuario: Quantos dias por semana posso trabalhar em home office?
    resposta: Você pode trabalhar de casa até 2 dias por semana.
  - usuario: Preciso usar VPN no home office?
    resposta: >-
      Sim. A conexão à rede da empresa só pode ser feita pela VPN corporativa, e o uso de
      computador pessoal para acessar sistemas internos não é permitido.
  - usuario: Quanto é o vale-refeição por dia útil?
    resposta: >-
      O vale-refeição é de R$ 45,00 por dia útil trabalhado, creditado no cartão de
      benefícios no primeiro dia útil de cada mês.
  - usuario: Quanto é a coparticipação do plano de saúde?
    resposta: A coparticipação do plano de saúde Saúde Vida Plus é de 20% nas consultas e exames.
  - usuario: Quais são as minhas tarefas?
    resposta: >-
      Suas tarefas são: Enviar relatório mensal (sem prazo definido) e Renovar crachá (sem
      prazo definido).
  - usuario: Qual a capital da França?
    resposta: Não encontrei essa informação nos documentos disponíveis.

